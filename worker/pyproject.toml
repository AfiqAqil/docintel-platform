[project]
name = "docintel-worker"
version = "0.1.0"
description = "AI processing service: SQS consumer and LangGraph document workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain>=0.3.15",
    "langchain-aws>=0.2.10",
    "langchain-openai>=0.3.0",
    "pydantic>=2.10",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "python-json-logger>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-boto3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Auto discovery rather than an explicit list. The explicit list broke `pip install .`
# whenever a package had not been written yet, and it would need editing again every time
# one is added, which is exactly the kind of thing that gets forgotten.
[tool.setuptools.packages.find]
include = ["consumer*", "graph*", "llm*", "rules*"]

# config.py is a top level module, not a package, so packages.find does not pick it up.
# Without this an installed wheel imports graph and llm fine and then fails on
# `from config import CONFIG`, a failure that appears only in the container and never in a
# source checkout.
[tool.setuptools]
py-modules = ["config"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Tests are exempt from the annotation requirement only. Every other check still applies to
# them, so a real type error in a test is still an error. Requiring `-> None` on several
# hundred test functions catches nothing and makes the signal harder to read.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL, deselect with -m 'not integration'"]
