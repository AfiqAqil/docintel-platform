[project]
name = "docintel-worker"
version = "0.1.0"
description = "AI processing service: SQS consumer and LangGraph document workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain>=0.3.15",
    "langchain-aws>=0.2.10",
    "langchain-openai>=0.3.0",
    "pydantic>=2.10",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "python-json-logger>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-boto3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["consumer", "graph", "llm", "rules"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL, deselect with -m 'not integration'"]
