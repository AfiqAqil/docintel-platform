# Validation on every pull request. Nothing here can change AWS: the only role this workflow
# may assume is read only, and it is assumable only from a pull_request event.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"

jobs:
  python:
    name: python (${{ matrix.service }})
    # arm64, because the images and the Fargate tasks are arm64. One architecture everywhere
    # means a wheel that builds in CI is the wheel that ships.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker]

    services:
      # The claim, the reaper and the API's conditional updates are tested against a real
      # PostgreSQL, because the SQL is the thing under test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel
      TEST_DATABASE_DSN: postgresql://docintel:docintel@localhost:5432/docintel

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true

      # The worker's database tests create their schema by running the BACKEND's Alembic
      # migration, so there is one definition of the table. That needs the backend's
      # virtualenv to exist, whichever service this matrix leg is testing.
      - name: Install backend (always, for its migration)
        working-directory: backend
        run: uv sync --frozen --extra dev --python 3.12

      - name: Install ${{ matrix.service }}
        if: matrix.service != 'backend'
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen --extra dev --python 3.12

      - name: ruff
        working-directory: ${{ matrix.service }}
        run: uv run --frozen ruff check .

      - name: mypy
        working-directory: ${{ matrix.service }}
        run: uv run --frozen mypy .

      # The tests drive the graph with a fake LLM. CI never calls a paid API and holds no
      # model credential, whichever provider the environment is configured for.
      - name: pytest
        working-directory: ${{ matrix.service }}
        run: |
          uv run --frozen pytest -q -ra | tee pytest.out
          # A skipped test here means the database tests quietly did not run. That must fail
          # the build, not pass it.
          if grep -Eq '[0-9]+ skipped' pytest.out; then
            echo "::error::tests were skipped. The database suite did not run."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc --noEmit, then vite build
      - run: npm run build

  images:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built, never pushed. Pushing needs the deploy role, which a pull request cannot assume.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  terraform:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write      # to request the OIDC token
      pull-requests: write # to post the plan
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: validate (bootstrap)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      # Read only. It can plan and it cannot change anything. Its trust policy accepts only
      # the pull_request subject of this repository.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init and validate (main)
        run: |
          terraform -chdir=infra init -input=false -backend-config=envs/dev.backend.hcl
          terraform -chdir=infra validate

      # The plan uses the image tag that is running now, so what it shows is the
      # infrastructure change in this pull request and not a redeploy of the application.
      - name: Find the deployed image tag
        id: deployed
        run: |
          taskdef=$(aws ecs describe-services --cluster docintel-dev --services backend \
            --query 'services[0].taskDefinition' --output text 2>/dev/null || true)
          if [ -n "$taskdef" ] && [ "$taskdef" != "None" ]; then
            image=$(aws ecs describe-task-definition --task-definition "$taskdef" \
              --query 'taskDefinition.containerDefinitions[0].image' --output text)
            echo "tag=${image##*:}" >> "$GITHUB_OUTPUT"
          else
            # Nothing is deployed, for example after a destroy. Plan as a fresh environment.
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: plan
        env:
          # The allowlist is machine and office specific, so it is a repository variable and
          # not a committed file. Format: ["203.0.113.10/32"]
          TF_VAR_allowed_cidrs: ${{ vars.ALLOWED_CIDRS }}
        run: |
          terraform -chdir=infra plan -input=false -no-color -lock-timeout=60s \
            -var-file=envs/dev.tfvars \
            -var="image_tag=${{ steps.deployed.outputs.tag }}" | tee plan.txt

      - name: Post the plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan (dev)"
            echo
            echo '```'
            grep -E '^(Plan:|No changes\.|  # )' plan.txt || true
            echo '```'
            echo
            echo "Full output is in the job log."
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last \
            || gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
